name: Build and Push Docker Image (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag (default: testes)'
        required: false
        default: 'testes'

env:
  DOCKER_IMAGE: trancongthuong/appbanhang-express

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ inputs.tag || 'testes' }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:${{ inputs.tag || 'testes' }}
          cache-to: type=inline

      - name: Image digest
        run: echo "Image pushed to Docker Hub: ${{ env.DOCKER_IMAGE }}:${{ inputs.tag || 'testes' }}"

