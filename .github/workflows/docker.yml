name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - 'README.md'
      - '**.md'
      - '.gitignore'
      - '.dockerignore'

env:
  DOCKER_IMAGE: trancongthuong/appbanhang-express
  DOCKER_TAG: testes

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # These secrets must be configured in GitHub repository settings
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-to: type=inline

      - name: Image digest
        run: |
          echo "Image pushed to Docker Hub: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"



